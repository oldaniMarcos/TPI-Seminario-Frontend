<img src="placeholder.jpg" class="image-banner" alt="">
<div class="container">
  <h1>Mascotas</h1>

  <div class="actions-bar">
    <div class="left-actions">
      <button class="btn" (click)="newPet()" [disabled]="clientDisabled">Nuevo</button>
      <button class="btn" (click)="adoptPet()" [disabled]="clientDisabled">Adoptar</button>
    </div>

    <div class="right-actions">
      <button class="exit" routerLink="/clients">Volver</button>
    </div>
  </div>

  <app-pets-table [pets]="pets" (stateChangeRequest)="confirmStateChange($event)" (editRequest)="editPet($event)" [clientDisabled]="clientDisabled">
  </app-pets-table>

  <div *ngIf="clientDisabled" class="error-message">
    {{ clientDisabledMessage }}
  </div>

  <p-dialog [(visible)]="showDialog" [modal]="true" [header]="dialogTitle" closeOnEscape="false" draggable="false"
    resizable="false" [style]="{width: '25%'}">
  
    <app-pets-dialog [data]="selectedPet" (save)="onSave($event)" (cancel)="onCancel()">
    </app-pets-dialog>
  
  </p-dialog>

<p-confirmDialog></p-confirmDialog>
