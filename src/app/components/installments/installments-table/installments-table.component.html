<table class="table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Tipo Doc.</th>
      <th>Nro. Doc.</th>
      <th>Nombre y Apellido</th>
      <th>Cuotas</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td>{{ client!.id }}</td>
      <td>{{ client!.docType }}</td>
      <td>{{ client!.docNum }}</td>
      <td>{{ client!.fullName }}</td>
      
      <td>
        <div *ngFor="let i of client!.installments" class="installment-row">
          <div class="installments">
            {{ i.amount | currency }} - {{ i.dueDate }}
          </div>
          <button class="btn btn-small" [disabled]="!isInstallmentPayable(i)" (click)="payInstallment(i)">
            Pagar
          </button>
        </div>
      </td>

    </tr>
  </tbody>
</table>
