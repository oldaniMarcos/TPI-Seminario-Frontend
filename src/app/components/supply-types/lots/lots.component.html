<img src="placeholder.jpg" class="image-banner" alt="">
<div class="container">
  <h1>Lotes</h1>

  <div class="actions-bar">
    <div class="left-actions">
      <button class="btn" (click)="newLot()">Nuevo</button>
    </div>

    <div class="right-actions">
      <button class="exit" routerLink="/supply-types">Volver</button>
    </div>
  </div>


  <app-lots-table [lots]="lots" (edit)="editLot($event)" [supplyTypeId]="supplyTypeId" (delete)="confirmDelete($event)">
  </app-lots-table>

  <p-dialog [(visible)]="showDialog" [modal]="true" [header]="dialogTitle" closeOnEscape="false" draggable="false"
    resizable="false" [style]="{width: '25%'}">
  
    <app-lots-dialog [data]="selectedLot" [supplyTypeId]="supplyTypeId" (save)="onSave($event)" (cancel)="onCancel()">
    </app-lots-dialog>
  
  </p-dialog>

  <p-confirmDialog></p-confirmDialog>
