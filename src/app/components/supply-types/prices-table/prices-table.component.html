<table class="table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Fecha Desde</th>
      <th>Moneda</th>
      <th>Precio</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let price of prices">
      <td>{{ price.id }}</td>
      <td>{{ price.beginDate }}</td>
      <td>{{ price.currency }}</td>
      <td>{{ price.price }}</td>
    </tr>
  </tbody>
</table>
