<img src="placeholder.jpg" class="image-banner" alt="">
<div class="container">
  <h1>Precios</h1>

  <div class="actions-bar">
    <div class="left-actions">
      <button class="btn" (click)="newPrice()">Nuevo</button>
    </div>

    <div class="right-actions">
      <button class="exit" routerLink="/supply-types">Volver</button>
    </div>
  </div>


  <app-prices-table [prices]="supplyPrices">
  </app-prices-table>

  <p-dialog [(visible)]="showDialog" [modal]="true" [header]="dialogTitle" closeOnEscape="false" draggable="false"
    resizable="false" [style]="{width: '25%'}">
  
    <app-prices-dialog [data]="selectedPrice" [supplyTypeId]="supplyTypeId" (save)="onSave($event)" (cancel)="onCancel()">
    </app-prices-dialog>
  
  </p-dialog>
