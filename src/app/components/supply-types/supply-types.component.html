<img src="placeholder.jpg" class="image-banner" alt="">
<div class="container">
  <h1>Tipos de Insumos</h1>

  <div class="actions-bar">
    <div class="left-actions">
      <button class="btn" (click)="newType()">Nuevo</button>
    </div>

    <div class="right-actions">
      <button class="exit" routerLink="/manage">Volver</button>
    </div>
  </div>

  <app-supply-types-table [supplyTypes]="supplyTypes" (edit)="onEdit($event)">
  </app-supply-types-table>

  <p-dialog [(visible)]="showDialog" [modal]="true" [header]="dialogTitle" closeOnEscape="false" draggable="false"
    resizable="false" [style]="{width: '25%'}">
  
    <app-supply-types-dialog [data]="selectedSupplyType" [supplyTypeId]="supplyTypeId" (save)="onSave($event)" (cancel)="onCancel()">
    </app-supply-types-dialog>
  
  </p-dialog>
  
  <p-confirmDialog></p-confirmDialog>
