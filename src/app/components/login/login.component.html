<img src="banner-cropped.png" class="image-banner" alt="">
<div class="container">
  
  <h1>Animales Felices</h1>
  <h2>Bienvenido</h2>

  <form (ngSubmit)="onSubmit()">
    <div class="input-group">
      <label for="username">Nombre de usuario</label>
      <input [(ngModel)]="loginData.username" name="username" id="username" required />
    </div>

    <div class="input-group">
      <label for="password">Contraseña</label>
      <input [(ngModel)]="loginData.password" name="password" type="password" id="password" required />
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>


    <button type="submit" class="btn">Iniciar Sesión</button>
  </form>

</div>
